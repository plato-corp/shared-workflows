name: Secrets Scanning

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full HEAD history with Gitleaks
        env:
          URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir/bin"
          curl -fsSL -o "$dir/gitleaks.tar.gz" "$URL"
          printf '%s  %s\n' "$SHA256" "$dir/gitleaks.tar.gz" | sha256sum --check --strict --quiet -
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir/bin" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$dir/gitleaks.toml"
          : > "$dir/gitleaksignore"
          # Scan Git metadata so consumer ignore files cannot suppress findings.
          "$dir/bin/gitleaks" git "$GITHUB_WORKSPACE/.git" \
            --config "$dir/gitleaks.toml" \
            --gitleaks-ignore-path "$dir/gitleaksignore" \
            --redact --no-banner --ignore-gitleaks-allow --log-opts=HEAD

  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full HEAD history with TruffleHog
        env:
          URL: https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.8/trufflehog_3.99.8_linux_amd64.tar.gz
          SHA256: 7c3b02f160f28929a467e29e20fba98746e0729f6e37c3c25761e4f8789abe08
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/trufflehog"
          mkdir -p "$dir/bin"
          curl -fsSL -o "$dir/trufflehog.tar.gz" "$URL"
          printf '%s  %s\n' "$SHA256" "$dir/trufflehog.tar.gz" | sha256sum --check --strict --quiet -
          tar -xzf "$dir/trufflehog.tar.gz" -C "$dir/bin" trufflehog
          # Scanner output may contain secrets; never print the raw files.
          if ! "$dir/bin/trufflehog" git "file://$GITHUB_WORKSPACE" --branch HEAD \
            --no-update --fail-on-scan-errors \
            --results=verified,unknown,unverified --json \
            > "$dir/results.json" 2> "$dir/scan.log"; then
            echo "::error::TruffleHog scan failed. Output is withheld to avoid exposing secret material."
            exit 1
          fi
          if ! count="$(jq -s 'length' "$dir/results.json" 2>/dev/null)"; then
            echo "::error::Unable to parse TruffleHog results."
            exit 1
          fi
          if [ "$count" -ne 0 ]; then
            echo "::error::TruffleHog found $count potential secret(s) (verified, unknown or unverified)."
            echo "Findings by detector:"
            jq -r '.DetectorName // "unknown"' "$dir/results.json" 2>/dev/null | sort | uniq -c
            exit 1
          fi
          echo "TruffleHog found no secrets."

  secrets:
    name: secrets
    needs: [gitleaks, trufflehog]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both scanners to succeed
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          TRUFFLEHOG_RESULT: ${{ needs.trufflehog.result }}
        run: |
          set -euo pipefail
          echo "gitleaks: $GITLEAKS_RESULT, trufflehog: $TRUFFLEHOG_RESULT"
          if [ "$GITLEAKS_RESULT" != success ] || [ "$TRUFFLEHOG_RESULT" != success ]; then
            echo "::error::Secrets scanning did not pass."
            exit 1
          fi
